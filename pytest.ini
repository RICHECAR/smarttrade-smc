[pytest]
# Only collect tests from the 'tests' package to avoid non-test artifacts
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Prevent accidental collection of raw data/log files
norecursedirs = .venv .pytest_cache node_modules

# Skip legacy smoke script and standalone Kraken integration scripts (not real pytest tests)
addopts = --ignore=test_order_manager_smoke.py --ignore=tests/test_kraken_auth.py --ignore=tests/test_kraken_futures_balance.py --ignore=tests/test_kraken_sig.py --ignore=tests/test_multi_broker_integration.py --ignore=tests/test_kraken_futures_client.py --strict-markers

markers =
    unit: Pure unit tests — no I/O, no network, fast
    integration: Tests that touch DB, disk, or multiple modules
    resilience: Fault injection, timeout, and stress tests
    slow: Tests that take > 5s
    security: Auth, CORS, and input validation tests
