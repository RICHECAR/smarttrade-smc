version: '3.8'

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: smc_prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    ports:
      - "9090:9090"
    restart: unless-stopped
    network_mode: host # Allows scraping the Python bot running locally at 127.0.0.1:8000

  grafana:
    image: grafana/grafana:latest
    container_name: smc_grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin_smc
    ports:
      - "3000:3000"
    restart: unless-stopped
    depends_on:
      - prometheus
    network_mode: host
