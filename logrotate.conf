# Logrotate configuration for Trading Bot
# Place this file in /etc/logrotate.d/trading-bot
# Or include via: logrotate /path/to/logrotate.conf

# ─── Logs principaux ─────────────────────────────────────────────────
/path/to/bitget-smc-auto-trader/logs/*.log
/path/to/bitget-smc-auto-trader/logs/*.jsonl
/path/to/bitget-smc-auto-trader/*.log
{
    # Rotation quotidienne
    daily

    # Garder 30 jours
    rotate 30

    # Compresser les anciens logs
    compress
    delaycompress

    # Ne pas échouer si le fichier n'existe pas
    missingok
    notifempty

    # Taille max avant rotation forcée
    maxsize 100M

    # Créer un nouveau fichier après rotation
    create 0644 root root

    # Format de date dans le nom du fichier roté
    dateext
    dateformat -%Y%m%d

    # Post-rotation: redémarrer le service si nécessaire
    # postrotate
    #     systemctl reload trading-bot 2>/dev/null || true
    # endscript
}

# ─── Reports ─────────────────────────────────────────────────────────
/path/to/bitget-smc-auto-trader/reports/*.json
/path/to/bitget-smc-auto-trader/reports/*.csv
{
    weekly
    rotate 8
    compress
    missingok
    notifempty
    maxsize 50M
}
